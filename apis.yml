name: eFishery
description: >-
  eFishery is an Indonesian aquaculture technology ("fishtech") company founded
  in 2013 in Bandung by Gibran Huzaifah and Chrisna Aditya. Its platform combined
  an IoT smart auto-feeder (eFeeder) that dispenses feed to fish and shrimp ponds
  and streams pond telemetry to a smartphone app, with an integrated services
  layer: eFisheryKu / eFarm farm-management software, eFund (including the Kabayan
  "pay later" financing product) linking smallholder farmers to lenders, and
  eFresh / eMart marketplaces connecting farmers to feed suppliers and downstream
  buyers. The company raised a $90M Series C (2022) and a $200M Series D (2023) at
  a unicorn valuation, backed by investors including 500 Global, Aqua-Spark, SoftBank
  Vision Fund 2, Temasek, and Northstar. In late 2024 an audit alleged large-scale
  financial-statement fraud dating to 2018; both founders resigned and the company
  underwent multiple rounds of layoffs and restructuring through 2025. This record
  was surfaced as a 500 Global portfolio company and enriched by the API Evangelist
  pipeline; eFishery exposes no public developer API or developer portal, and its
  primary efishery.com domain currently resolves to a parked/forwarding host.
